name: Validate and release Git Workbench

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI_REPORT_DIR: test-results/ci
      # There are no signing credentials in validation, including fork PRs. macOS uses only
      # the configured ad-hoc identity to repair signatures after universal-bundle merging.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: npm run ci:step -- install
      - name: Report test capabilities
        id: capabilities
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run ci:step -- capabilities
      - name: Check types, style and unit tests
        id: check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run ci:step -- check
      - name: Build application
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run ci:step -- build
      - name: Build native installer
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run ci:step -- package
      - name: Configure Linux sandbox helper
        id: sandbox
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        run: npm run ci:step -- sandbox
      - name: Check Linux desktop workflows
        id: desktop
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.sandbox.outcome == 'success' }}
        run: npm run ci:step -- desktop
      - name: Check native desktop smoke
        id: native-smoke
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.build.outcome == 'success' }}
        run: npm run ci:step -- native-smoke
      - name: Check packaged application sandbox and workflows
        id: package-smoke
        if: ${{ !cancelled() && steps.package.outcome == 'success' && (runner.os != 'Linux' || steps.sandbox.outcome == 'success') }}
        run: npm run ci:step -- package-smoke
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          compression-level: 0
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - name: Summarize validation results
        if: always()
        env:
          CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: node scripts/ci-report.ts
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            test-results/ci/
            test-results/desktop/
            release/p14/package-verified/
          retention-days: 14
          if-no-files-found: warn

  release-assets:
    name: Assemble installers and verify Arch recipe
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Generate AUR files and complete release checksums
        id: prepare
        run: node scripts/prepare-release.ts
      - name: Build the Arch package in an isolated container
        run: node scripts/verify-aur.ts
      - name: Upload complete release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.prepare.outputs.tag }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/PKGBUILD
            release/git-workbench-bin.SRCINFO
            release/git-workbench-bin-*.tar.gz
            release/SHA256SUMS
            release/artifact-manifest.json
          compression-level: 0
          overwrite: true
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish new package.json version
    needs: release-assets
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: git-workbench-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.release-assets.outputs.tag }}
          path: release
      - name: Publish complete draft and immutable version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.ts
