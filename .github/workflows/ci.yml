name: Validate Git Workbench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check Linux packaging
        if: runner.os == 'Linux'
        run: npm run package
      - name: Check Linux desktop workflows
        if: runner.os == 'Linux'
        run: npx playwright test
      - name: Check extracted AppImage sandbox and workflows
        if: runner.os == 'Linux'
        run: npm run test:package
